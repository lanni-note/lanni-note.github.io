<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCA 投資組合展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bybitDark: '#131722',
                        bybitCard: '#1E232F',
                        bybitYellow: '#F3A632',
                        bybitGreen: '#2EBD85',
                        bybitRed: '#F6465D',
                        bybitText: '#B7BDC6'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="text-white font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4 md:p-8 relative">

    <div id="captureArea" class="w-full max-w-5xl bg-bybitDark shadow-2xl rounded-2xl overflow-hidden border border-gray-800">
        
        <div class="flex justify-between items-center p-6 border-b border-gray-800 bg-[#181d2a]">
            <h1 class="text-2xl font-bold tracking-wider">加密貨幣定投成效 (DCA)</h1>
            
            <button id="downloadBtn" data-html2canvas-ignore="true" class="bg-bybitYellow text-black text-sm font-bold px-4 py-1.5 rounded shadow hover:bg-yellow-500 transition-colors cursor-pointer">
                下載圖片
            </button>
        </div>

        <div class="p-6 flex flex-col md:flex-row gap-6">
            <div class="md:w-1/3 flex flex-col justify-center bg-bybitCard rounded-xl p-6 border border-gray-800 shadow-inner shrink-0">
                <p class="text-bybitText text-base mb-2">總定投估值 (USDT)</p>
                <h2 class="text-5xl font-bold mb-4" id="topTotalValuation">0.00</h2>
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-bybitText">總投資本金</span>
                    <span id="topTotalInvested" class="text-sm font-semibold text-white">$0.00</span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-sm text-bybitText">累積總報酬率</span>
                    <span id="topTotalROI" class="text-bybitGreen font-bold text-base">+0.00%</span>
                </div>
            </div>
            <div class="md:w-2/3 bg-bybitCard rounded-xl p-5 border border-gray-800 shadow-inner flex flex-col">
                <p class="text-sm text-bybitText mb-2">總資產成長趨勢</p>
                <div class="flex-1 w-full relative min-h-[160px]">
                    <canvas id="totalChart"></canvas>
                </div>
            </div>
        </div>

        <div class="p-6 pt-0">
            <h3 class="text-xl font-bold mb-4 border-l-4 border-bybitYellow pl-3">持倉明細</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="coinList">
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
